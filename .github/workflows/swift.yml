name: Build iOS T9 Keyboard IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Locate Project Root
      run: |
        SPEC_FILE=$(find . -name "project.yml" | head -n 1)
        if [ -z "$SPEC_FILE" ]; then
          echo "Error: project.yml tidak ditemukan!"
          find . -maxdepth 3
          exit 1
        fi
        PROJECT_DIR=$(dirname "$SPEC_FILE")
        echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
        echo "Project directory is at: $PROJECT_DIR"

    - name: Install XcodeGen
      run: |
        brew install xcodegen

    - name: Generate Native Apple Xcode Project
      run: |
        cd "$PROJECT_DIR"
        xcodegen generate

    - name: Build App with Xcode
      run: |
        cd "$PROJECT_DIR"
        xcodebuild clean build \
          -project T9Keyboard.xcodeproj \
          -scheme T9Keyboard \
          -configuration Release \
          -sdk iphoneos \
          -destination 'generic/platform=iOS' \
          CONFIGURATION_BUILD_DIR="$(pwd)/build/Release-iphoneos" \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          AD_HOC_CODE_SIGNING_ALLOWED=YES

    - name: Package Unsigned IPA
      run: |
        cd "$PROJECT_DIR"
        mkdir -p Payload
        cp -R build/Release-iphoneos/T9Keyboard.app Payload/
        
        # Pastikan folder PlugIns berisi ekstensi keyboard
        mkdir -p Payload/T9Keyboard.app/PlugIns
        cp -R build/Release-iphoneos/T9KeyboardExtension.appex Payload/T9Keyboard.app/PlugIns/ 2>/dev/null || true
        
        zip -r T9Keyboard.ipa Payload
        mv T9Keyboard.ipa "$GITHUB_WORKSPACE/"

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: T9Keyboard-iPhone14Plus-IPA
        path: T9Keyboard.ipa
        retention-days: 7

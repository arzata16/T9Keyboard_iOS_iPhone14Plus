name: Build iOS T9 Keyboard IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Prepare Base Directory
      run: |
        echo "=== Locating Source Folders ==="
        EXT_DIR=$(find . -type d -name "T9KeyboardExtension" | head -n 1)
        if [ -z "$EXT_DIR" ]; then
          echo "Error: Folder T9KeyboardExtension tidak ditemukan di repository!"
          find . -maxdepth 3
          exit 1
        fi

        BASE_DIR=$(dirname "$EXT_DIR")
        echo "Base project directory is: $BASE_DIR"
        echo "BASE_DIR=$BASE_DIR" >> $GITHUB_ENV

        ls -la "$BASE_DIR"

    - name: Show Xcode Version
      run: |
        echo "Active Xcode: $(xcode-select -p)"
        xcodebuild -version
        xcrun swift --version

    - name: Install XcodeGen
      run: |
        brew install xcodegen || brew upgrade xcodegen || true
        xcodegen --version

    - name: Generate Xcode Project
      run: |
        cd "$BASE_DIR"
        echo "=== project.yml ==="
        cat project.yml
        echo "=== Generating Xcode Project ==="
        xcodegen generate

    - name: Build App with Xcode
      run: |
        cd "$BASE_DIR"

        set -o pipefail
        xcodebuild clean build \
          -project T9Keyboard.xcodeproj \
          -scheme T9Keyboard \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          -derivedDataPath build/DerivedData \
          CODE_SIGN_STYLE=Manual \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          AD_HOC_CODE_SIGNING_ALLOWED=YES \
          SWIFT_TREAT_WARNINGS_AS_ERRORS=NO 2>&1 | tee xcodebuild.log

    - name: Print Xcode Build Errors on Failure
      if: failure()
      run: |
        cd "$BASE_DIR"
        if [ -f xcodebuild.log ]; then
          echo "==================== BUILD FAILED! ERROR DETAILS ===================="
          grep -C 3 -E "error:|fatal error:|BUILD FAILED" xcodebuild.log || tail -n 80 xcodebuild.log
          echo "====================================================================="
        fi

    - name: Upload Build Log on Failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: xcodebuild-failure-log
        path: ${{ env.BASE_DIR }}/xcodebuild.log

    - name: Package Unsigned IPA
      run: |
        cd "$BASE_DIR"

        echo "=== Searching for built products ==="
        find build/DerivedData -name "*.app" -o -name "*.appex"

        APP_PATH=$(find build/DerivedData -name "T9Keyboard.app" -type d | head -n 1)
        if [ -z "$APP_PATH" ]; then
          echo "Error: T9Keyboard.app tidak ditemukan!"
          exit 1
        fi
        echo "Found App at: $APP_PATH"

        rm -rf Payload
        mkdir -p Payload
        cp -R "$APP_PATH" Payload/

        # Pastikan Extension ada di dalam PlugIns
        mkdir -p Payload/T9Keyboard.app/PlugIns
        EXT_PATH=$(find build/DerivedData -name "T9KeyboardExtension.appex" -type d | head -n 1)
        if [ -n "$EXT_PATH" ]; then
          echo "Embedding extension from: $EXT_PATH"
          cp -R "$EXT_PATH" Payload/T9Keyboard.app/PlugIns/
        fi

        echo "=== Payload contents ==="
        ls -la Payload/T9Keyboard.app/
        ls -la Payload/T9Keyboard.app/PlugIns/ 2>/dev/null || true

        echo "=== Creating IPA ==="
        rm -f "$GITHUB_WORKSPACE/T9Keyboard.ipa"
        zip -r "$GITHUB_WORKSPACE/T9Keyboard.ipa" Payload
        ls -lh "$GITHUB_WORKSPACE/T9Keyboard.ipa"

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: T9Keyboard-iPhone14Plus-IPA
        path: ${{ github.workspace }}/T9Keyboard.ipa
        retention-days: 7

name: Build iOS T9 Keyboard IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Prepare Base Directory
      run: |
        echo "=== Locating Source Folders ==="
        EXT_DIR=$(find . -type d -name "T9KeyboardExtension" | head -n 1)
        if [ -z "$EXT_DIR" ]; then
          echo "Error: Folder T9KeyboardExtension tidak ditemukan di repository!"
          find . -maxdepth 3
          exit 1
        fi

        BASE_DIR=$(dirname "$EXT_DIR")
        echo "Base project directory is: $BASE_DIR"
        echo "BASE_DIR=$BASE_DIR" >> $GITHUB_ENV

        ls -la "$BASE_DIR"

    - name: Select Xcode
      run: |
        XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n 1)
        if [ -n "$XCODE_PATH" ]; then
          sudo xcode-select -s "$XCODE_PATH"
        fi
        echo "Using Xcode at: $(xcode-select -p)"
        xcodebuild -version
        xcrun swift --version

    - name: Install XcodeGen
      run: |
        brew install xcodegen || brew upgrade xcodegen || true
        xcodegen --version

    - name: Generate Xcode Project
      run: |
        cd "$BASE_DIR"

        cat > project.yml << 'ENDOFYAML'
name: T9Keyboard
options:
  bundleIdPrefix: com.developer
  deploymentTarget:
    iOS: "15.0"

targets:
  T9Keyboard:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - T9Keyboard
    dependencies:
      - target: T9KeyboardExtension
    settings:
      base:
        INFOPLIST_FILE: T9Keyboard/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.developer.t9keyboard
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        AD_HOC_CODE_SIGNING_ALLOWED: "YES"
        SWIFT_TREAT_WARNINGS_AS_ERRORS: "NO"

  T9KeyboardExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - T9KeyboardExtension
    settings:
      base:
        INFOPLIST_FILE: T9KeyboardExtension/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.developer.t9keyboard.extension
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        AD_HOC_CODE_SIGNING_ALLOWED: "YES"
        SWIFT_TREAT_WARNINGS_AS_ERRORS: "NO"
ENDOFYAML

        echo "=== Generated project.yml ==="
        cat project.yml
        echo "=== Running XcodeGen ==="
        xcodegen generate

    - name: Build App with Xcode
      run: |
        cd "$BASE_DIR"

        xcodebuild clean build \
          -project T9Keyboard.xcodeproj \
          -scheme T9Keyboard \
          -configuration Release \
          -sdk iphoneos \
          -destination 'generic/platform=iOS' \
          -arch arm64 \
          ONLY_ACTIVE_ARCH=NO \
          CONFIGURATION_BUILD_DIR="$(pwd)/build/Release-iphoneos" \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          AD_HOC_CODE_SIGNING_ALLOWED=YES \
          SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
          GCC_TREAT_WARNINGS_AS_ERRORS=NO

    - name: Package Unsigned IPA
      run: |
        cd "$BASE_DIR"

        echo "=== Build output ==="
        find build -name "*.app" -o -name "*.appex" 2>/dev/null || true

        mkdir -p Payload
        cp -R build/Release-iphoneos/T9Keyboard.app Payload/

        mkdir -p Payload/T9Keyboard.app/PlugIns
        cp -R build/Release-iphoneos/T9KeyboardExtension.appex Payload/T9Keyboard.app/PlugIns/ 2>/dev/null || true

        zip -r T9Keyboard.ipa Payload
        mv T9Keyboard.ipa "$GITHUB_WORKSPACE/"

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: T9Keyboard-iPhone14Plus-IPA
        path: T9Keyboard.ipa
        retention-days: 7

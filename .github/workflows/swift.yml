name: Build iOS T9 Keyboard IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Prepare Base Directory
      run: |
        echo "=== Locating Source Folders ==="
        EXT_DIR=$(find . -type d -name "T9KeyboardExtension" | head -n 1)
        if [ -z "$EXT_DIR" ]; then
          echo "Error: Folder T9KeyboardExtension tidak ditemukan di repository!"
          find . -maxdepth 3
          exit 1
        fi
        
        BASE_DIR=$(dirname "$EXT_DIR")
        echo "Base project directory is: $BASE_DIR"
        echo "BASE_DIR=$BASE_DIR" >> $GITHUB_ENV
        
        ls -la "$BASE_DIR"

    - name: Install XcodeGen
      run: |
        brew install xcodegen || brew upgrade xcodegen || true
        xcodegen --version

    - name: Generate Native Apple Xcode Project
      run: |
        cd "$BASE_DIR"
        
        # Buat project.yml otomatis di folder yang tepat
        cat << 'EOF' > project.yml
        name: T9Keyboard
        options:
          bundleIdPrefix: com.developer
          deploymentTarget:
            iOS: "15.0"

        targets:
          T9Keyboard:
            type: application
            platform: iOS
            deploymentTarget: "15.0"
            sources:
              - T9Keyboard
            dependencies:
              - target: T9KeyboardExtension
            settings:
              base:
                INFOPLIST_FILE: T9Keyboard/Info.plist
                PRODUCT_BUNDLE_IDENTIFIER: com.developer.t9keyboard
                CODE_SIGNING_ALLOWED: NO
                CODE_SIGNING_REQUIRED: NO
                CODE_SIGN_IDENTITY: ""
                AD_HOC_CODE_SIGNING_ALLOWED: YES

          T9KeyboardExtension:
            type: app-extension
            platform: iOS
            deploymentTarget: "15.0"
            sources:
              - T9KeyboardExtension
            settings:
              base:
                INFOPLIST_FILE: T9KeyboardExtension/Info.plist
                PRODUCT_BUNDLE_IDENTIFIER: com.developer.t9keyboard.extension
                CODE_SIGNING_ALLOWED: NO
                CODE_SIGNING_REQUIRED: NO
                CODE_SIGN_IDENTITY: ""
                AD_HOC_CODE_SIGNING_ALLOWED: YES
        EOF

        xcodegen generate

    - name: Build App with Xcode
      run: |
        cd "$BASE_DIR"
        
        xcodebuild clean build \
          -project T9Keyboard.xcodeproj \
          -scheme T9Keyboard \
          -configuration Release \
          -sdk iphoneos \
          -destination 'generic/platform=iOS' \
          CONFIGURATION_BUILD_DIR="$(pwd)/build/Release-iphoneos" \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          AD_HOC_CODE_SIGNING_ALLOWED=YES

    - name: Package Unsigned IPA
      run: |
        cd "$BASE_DIR"
        mkdir -p Payload
        cp -R build/Release-iphoneos/T9Keyboard.app Payload/
        
        # Pastikan folder PlugIns berisi ekstensi keyboard
        mkdir -p Payload/T9Keyboard.app/PlugIns
        cp -R build/Release-iphoneos/T9KeyboardExtension.appex Payload/T9Keyboard.app/PlugIns/ 2>/dev/null || true
        
        zip -r T9Keyboard.ipa Payload
        mv T9Keyboard.ipa "$GITHUB_WORKSPACE/"

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: T9Keyboard-iPhone14Plus-IPA
        path: T9Keyboard.ipa
        retention-days: 7
